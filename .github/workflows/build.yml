name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
          cache-disabled: true
      - name: Force use Gradle 8.4 not wrapper
        run: |
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          gradle --version
          gradle assembleDebug --no-daemon --warning-mode none
      - uses: actions/upload-artifact@v4
        with:
          name: FlasherPro-APK
          path: app/build/outputs/apk/debug/*.apk
